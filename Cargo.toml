[workspace]
resolver = "2"
members = ["common", "ebpf", "collector", "tui", "exporter", "agent"]
default-members = ["common", "collector", "tui", "exporter", "agent"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
aya = { version = "0.14", default-features = false }
aya-build = { version = "0.2", default-features = false }
aya-ebpf = { version = "0.2.1", default-features = false }
anyhow = "1"
clap = { version = "4.5", default-features = false, features = ["std", "derive"] }
libc = "0.2"
tokio = { version = "1.53", default-features = false, features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync", "io-util"] }
ratatui = "0.29"
crossterm = "0.28"
netscope-common = { path = "common", features = ["user"] }

[profile.release.package.netscope-ebpf]
debug = 2
codegen-units = 1
strip = false
opt-level = 3
